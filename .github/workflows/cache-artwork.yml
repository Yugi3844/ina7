name: Download Ina7 artwork and publish site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ina7-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 110
    steps:
      - name: Get game files
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'Pillow>=11,<13'
      - name: Download player portraits and team emblems into assets
        run: python scripts/cache_artwork.py --workers 12
      - name: Save assets and updated game to repository
        run: |
          git config user.name "Ina7 art bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          if git diff --cached --quiet; then
            echo "Images already cached; nothing new to commit."
          else
            git commit -m "Update bundled Ina7 game artwork"
            git push
          fi
      - name: Prepare public website
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp -R assets site/assets
          cp .nojekyll site/.nojekyll
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
